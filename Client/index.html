<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon"  type="image/svg+xml" href="/1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credify Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Preload critical logos for instant rendering -->
    <link rel="preload" as="image" href="/logos/etisalat.png" />
    <link rel="preload" as="image" href="/logos/orange.png" />
    <link rel="preload" as="image" href="/logos/vodafone.png" />
    <link rel="preload" as="image" href="/logos/we.png" />
  </head>
  <body>
    <script>
      (function() {
        var theme = localStorage.getItem("credify_theme");
        if (theme) {
          document.documentElement.setAttribute("data-theme", theme);
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("credify_theme", "dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
